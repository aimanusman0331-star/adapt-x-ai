name: ADAPT-X Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check core.mjs
          node --check sw.js
      - name: Critical asset and version checks
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          for(const file of ['index.html','app.js','core.mjs','sw.js','manifest.webmanifest'])
            assert.ok(fs.existsSync(file), 'Missing '+file);
          assert.match(html, /id="game"/);
          assert.match(html, /id="portraitGate"/);
          assert.match(html, /id="brainBtn"/);
          assert.match(html, /app\.js\?v=\d+/);
          const version=html.match(/app\.js\?v=(\d+)/)?.[1];
          assert.ok(version, 'No versioned app script');
          assert.ok(sw.includes('app.js?v='+version), 'Service worker/app version mismatch');
          assert.ok(sw.includes('core.mjs?v='+version), 'Service worker/core version mismatch');
          assert.ok(manifest.name.includes('ADAPT-X'), 'Manifest name mismatch');
          console.log('Static quality gate passed for version',version);
          EOF
